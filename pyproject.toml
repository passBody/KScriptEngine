[project]
name = "kscript"
version = "0.1.0"
description = "KScript — 桌面自动化编排工具（步骤编排 + 热键执行）"
requires-python = ">=3.14"
dependencies = [
    "PyQt5>=5.15,<5.15.12",
    # PyQt5-Qt5 5.15.19 无 Windows wheel（uv 会解析到它导致装不上）；锁定 5.15.2
    "PyQt5-Qt5==5.15.2",
    "pynput>=1.7",
    "pyperclip>=1.11.0",
    # 显示/ 视觉步骤模板（文字识别、图片匹配、截图）硬依赖——
    # 模板在包加载时无条件 import，必须为主依赖（离线部署机随 uv sync 一并装）
    "numpy>=2",
    "pillow>=11",
    "opencv-python>=4.10",
    "rapidocr-onnxruntime>=1.2.3",
]
