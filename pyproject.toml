[project]
name = "kscript"
version = "0.1.0"
description = "KScript — 桌面自动化编排工具（步骤编排 + 热键执行）"
requires-python = ">=3.14"
dependencies = [
    "PyQt5>=5.15,<5.15.12",
    # PyQt5-Qt5 5.15.19 无 Windows wheel（uv 会解析到它导致装不上）；锁定 5.15.2
    "PyQt5-Qt5==5.15.2",
    "pynput>=1.7",
    "pyperclip>=1.11.0",
    # 视觉步骤（文字识别、图片匹配、等待图片出现）的执行期硬依赖。
    # 注意是**执行期**：actions/ 里对 libs.vision 的 import 全在函数内惰性执行，
    # 包加载不碰它们 —— 所以缺这几个包时冒烟照过，直到真跑视觉步骤才报错。
    # 属主依赖，随 uv sync 一并装。
    "numpy>=2",
    "pillow>=11",
    "opencv-python>=4.10",
    "rapidocr-onnxruntime>=1.2.3",
]
